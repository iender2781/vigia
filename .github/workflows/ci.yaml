name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      # Usuario sin privilegios de superusuario: así los tests comprueban también el aislamiento por RLS.
      CONTEXTO_TEST_DATABASE_URL: postgres://contexto:contexto@localhost:5432/contexto_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/contexto/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Base de datos de pruebas
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE contexto LOGIN PASSWORD 'contexto'"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE contexto_test OWNER contexto"
      - name: Web
        run: cd web/contexto && npm ci --no-audit --no-fund && npm run build
      - name: Go vet y tests (incluye integración con PostgreSQL y contratos)
        run: go vet ./... && go test -count=1 ./...
      - name: Ontología
        run: go run ./cmd/contexto ontology summary -dir ontology
      - name: Equivalencia con el correlador Python
        run: tools/reference/equivalence.sh
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          helm lint deploy/helm/vigia-contexto
          for e in dev pre pro; do
            helm template vigia-contexto deploy/helm/vigia-contexto -f deploy/gitops/$e/values.yaml > /tmp/$e.yaml
          done
          go run ./tools/helmcheck deploy/helm/vigia-contexto deploy/gitops/pro/values.yaml

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigia-contexto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
