# Parámetros de correlación heredados del correlador Python (se usan desde la fase 3).
fanout_overrides:
  f5_node: 500
  f5_node_address: 500
member_view:
  Pool F5:
    node_rel: apunta a
    probe_rel: monitorizado por
    rel: balancea a
relabel:
  - rename:
      name: veeam_item
    when:
      job: veeam_node
  - rename:
      partition: guest_partition
    when:
      job: vmware_.*
  - rename:
      name: panos_counter
    when:
      job: panos_exporter
  - rename:
      entity: esxi_host
    when:
      entity_type: HostSystem
  - rename:
      host: esxi_host
    when:
      vcenter: .+
  - rename:
      address: f5_node_address
      name: f5_tenant
      node: f5_node
      partition: f5_partition
      pool: f5_pool
      port: f5_port
      virtual_server: f5_virtual_server
    when:
      role: tenant
  - rename:
      name: f5_chassis_partition
      node: f5_blade
      tenant: f5_tenant
    when:
      role: chassis_partition
  - rename:
      address: f5_node_address
      name: f5_tenant
      node: f5_node
      partition: f5_partition
      pool: f5_pool
      port: f5_port
      virtual_server: f5_virtual_server
    when:
      servicio: f5.*
