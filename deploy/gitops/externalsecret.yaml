# Secreto de la aplicación, sincronizado desde Vault (ruta secret/vigia/<entorno>/contexto).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vigia-contexto-secrets
  namespace: vigia-app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: vigia-contexto-secrets
    template:
      data:
        # Servicio de lectura-escritura del clúster CloudNativePG; sslmode=require dentro del clúster.
        database-url: "postgres://{{ .dbuser }}:{{ .dbpassword }}@vigia-pg-rw.vigia-data.svc:5432/contexto?sslmode=require"
        api-tokens: "{{ .apitokens }}"
        prometheus-bearer-token: "{{ .prombearer }}"
  data:
    - {secretKey: dbuser, remoteRef: {key: secret/vigia/ENTORNO/contexto, property: db-user}}
    - {secretKey: dbpassword, remoteRef: {key: secret/vigia/ENTORNO/contexto, property: db-password}}
    - {secretKey: apitokens, remoteRef: {key: secret/vigia/ENTORNO/contexto, property: api-tokens}}
    - {secretKey: prombearer, remoteRef: {key: secret/vigia/ENTORNO/contexto, property: prometheus-bearer-token}}
