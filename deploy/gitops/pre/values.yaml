# Preproducción: igual que producción, apuntando al Prometheus real en solo lectura.
image: {tag: "0.1.0"}
tenant: {id: "REEMPLAZAR-UUID-EMPRESA", name: "Organización (pre)"}
prometheus:
  urls: [http://prometheus-0.monitoring.svc:9090, http://prometheus-1.monitoring.svc:9090]
alertmanager: {url: http://alertmanager.monitoring.svc:9093}
discovery: {replicas: 2, interval: 5m}
api: {replicas: 2}
auth: {mode: proxy}
ingress:
  enabled: true
  host: contexto.pre.vigia.dominio
  tls: {clusterIssuer: corp-ca}
  forwardAuth: {address: "http://oauth2-proxy.vigia-app.svc/"}
monitoring: {serviceMonitor: {enabled: true}, prometheusRule: {enabled: true}}
networkPolicy: {egressCIDRs: ["10.40.0.0/16"]}
