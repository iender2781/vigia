# Desarrollo: una réplica, sin alta disponibilidad, acceso con token.
image: {tag: "0.1.0"}
tenant: {id: "REEMPLAZAR-UUID-EMPRESA", name: "Organización (dev)"}
prometheus:
  urls: [http://prometheus-dev.monitoring.svc:9090]
alertmanager: {url: http://alertmanager-dev.monitoring.svc:9093}
discovery: {replicas: 1, interval: 5m}
api: {replicas: 1}
auth: {mode: token}
podDisruptionBudget: {enabled: false}
ingress: {enabled: true, host: contexto.dev.vigia.dominio, tls: {clusterIssuer: corp-ca}}
monitoring: {serviceMonitor: {enabled: true}, prometheusRule: {enabled: false}}
networkPolicy: {egressCIDRs: ["10.40.0.0/16"]}   # red de Prometheus/Alertmanager (ajustar)
log: {level: debug}
