{{- if and .Values.api.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "contexto.fullname" . }}
  labels:
    {{- include "contexto.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.forwardAuth.address }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-auth@kubernetescrd" .Release.Namespace (include "contexto.fullname" .) }}
    {{- end }}
    {{- if .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default "contexto-tls" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "contexto.fullname" . }}
                port: {name: http}
{{- end }}
{{- if and .Values.api.enabled .Values.ingress.enabled .Values.ingress.forwardAuth.address }}
---
# Autenticación delegada en oauth2-proxy (Traefik ForwardAuth).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "contexto.fullname" . }}-auth
  labels:
    {{- include "contexto.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.ingress.forwardAuth.address | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      {{- toYaml .Values.ingress.forwardAuth.responseHeaders | nindent 6 }}
---
# Rutas de oauth2-proxy (/oauth2/start, /oauth2/callback...) en el mismo host, sin el middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "contexto.fullname" . }}-oauth2
  labels:
    {{- include "contexto.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default "contexto-tls" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.forwardAuth.service.name }}
                port: {number: {{ .Values.ingress.forwardAuth.service.port }}}
{{- end }}
