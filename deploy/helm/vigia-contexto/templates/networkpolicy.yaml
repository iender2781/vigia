{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "contexto.fullname" . }}
  labels:
    {{- include "contexto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "contexto.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports:
        - {port: {{ .Values.service.port }}, protocol: TCP}
    - from:
        {{- range .Values.networkPolicy.monitoringNamespaces }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports:
        - {port: {{ .Values.service.opsPort }}, protocol: TCP}
  egress:
    - ports:   # DNS
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:      # PostgreSQL (CloudNativePG)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgresNamespace }}}}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.postgresPodLabels | nindent 14 }}
      ports:
        - {port: 5432, protocol: TCP}
    {{- if .Values.networkPolicy.egressCIDRs }}
    - to:      # Prometheus, Alertmanager y fuentes externas
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
