{{- if .Values.podDisruptionBudget.enabled }}
{{- range $role := list "api" "discovery" }}
{{- if and (index $.Values $role).enabled (gt (int (index $.Values $role).replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "contexto.fullname" $ }}-{{ $role }}
  labels:
    {{- include "contexto.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "contexto.selector" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
{{- end }}
{{- end }}
{{- end }}
